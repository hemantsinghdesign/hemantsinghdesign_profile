name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PROFILE_USER: hemantsinghdesign
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install daily dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py
      - name: Render animated assets
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile art [skip ci]'
            git push
          fi
